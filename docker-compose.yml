version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: pulse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123


  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulse-server
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUD_NAME}
      CLOUDINARY_API_KEY: ${API_KEY}
      CLOUDINARY_API_SECRET: ${API_SECRET}
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulse-client
    ports:
      - "3000:80"
    depends_on:
      - server
  
volumes:
  mongo-data: